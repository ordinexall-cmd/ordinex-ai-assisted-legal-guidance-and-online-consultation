name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ordinex
          POSTGRES_PASSWORD: ordinex
          POSTGRES_DB: ordinex_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ordinex"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ordinex:ordinex@localhost:5432/ordinex_ci
      DIRECT_URL: postgresql://ordinex:ordinex@localhost:5432/ordinex_ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Install server
        working-directory: server
        run: npm ci

      - name: Prisma generate
        working-directory: server
        run: npx prisma generate

      - name: Push schema to Postgres
        working-directory: server
        run: npx prisma db push --skip-generate

      - name: API smoke test
        working-directory: server
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-value-that-is-long-enough-1234
        run: node scripts/smoke-test.js
