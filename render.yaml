# Render Blueprint — Ordinex all-in-one (SPA + API + Socket.IO)
# One free Web Service serves the built frontend and the Node API on one origin.
# Database is external (Supabase free Postgres). Do NOT add a Render Postgres here —
# the free Render DB expires after 30 days.
#
# Secrets (JWT_SECRET, DATABASE_URL, DIRECT_URL, GROQ_API_KEY, ...) are set in the
# Render dashboard, not in this file.
services:
  - type: web
    name: ordinex
    runtime: node
    plan: free
    region: singapore
    branch: main
    # Build the SPA at repo root, install the server, generate Prisma client.
    # (Free instances do not support pre-deploy commands, so schema sync is in startCommand.)
    buildCommand: NPM_CONFIG_PRODUCTION=false npm install && npm run build && cd server && npm install && export DIRECT_URL="${DIRECT_URL:-$DATABASE_URL}" && npx prisma generate
    # Start from the server dir so uploads/ resolve; apply migrations then boot the API.
    startCommand: cd server && export DIRECT_URL="${DIRECT_URL:-$DATABASE_URL}" && (npx prisma migrate deploy || npx prisma db push --skip-generate --accept-data-loss) && node src/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: TRUST_PROXY
        value: "1"
      - key: PAYMENTS_MODE
        value: simulated
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
