# Render Blueprint — Ordinex all-in-one (SPA + API + Socket.IO)
# One free Web Service serves the built frontend and the Node API on one origin.
# Database is external (Neon free Postgres). Do NOT add a Render Postgres here —
# the free Render DB expires after 30 days.
#
# Secrets (JWT_SECRET, DATABASE_URL, DIRECT_URL, GROQ_API_KEY, ...) are set in the
# Render dashboard, not in this file.
services:
  - type: web
    name: ordinex
    runtime: node
    plan: free
    region: singapore
    branch: main
    # Build the SPA at repo root, install the server, generate Prisma client.
    # (Free instances do not support pre-deploy commands, so schema sync is in startCommand.)
    # --include=dev is required: Render sets NODE_ENV=production, which would
    # otherwise skip vite/typescript/@types (all in devDependencies).
    buildCommand: npm install --include=dev && npm run build && cd server && npm install && export DIRECT_URL="${DIRECT_URL:-$DATABASE_URL}" && npx prisma generate
    # Start from the server dir so uploads/ resolve; push schema then boot the API.
    startCommand: cd server && export DIRECT_URL="${DIRECT_URL:-$DATABASE_URL}" && npx prisma db push --skip-generate && node src/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: PAYMENTS_MODE
        value: simulated
      # Generate a strong secret once: Render can create it for you.
      - key: JWT_SECRET
        generateValue: true
      # Set these in the dashboard (marked sync:false so they are not committed):
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Optional: add GEMINI_API_KEY, SMTP_*, SEMAPHORE_API_KEY, GOOGLE_CLIENT_ID
      # in the dashboard. FRONTEND_URL / API_PUBLIC_URL default to the Render URL.
